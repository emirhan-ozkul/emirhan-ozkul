name: Generate Snake

on:
  # Her gün otomatik olarak çalıştırmak için (cron zamanlayıcısı)
  schedule:
    - cron: "0 0 * * *"

  # İstediğin zaman Actions sekmesinden manuel tetikleyebilmek için
  workflow_dispatch:

  # Repoya her push yapıldığında tetiklenmesi için
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#6796e3,#388bfd,#0366d6,#044289

      - name: Push generated snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
